<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Theme -->
  <meta name="theme-color" content="#142536" />

  <!-- SEO -->
  <meta name="description"
    content="Gratia Estates — premium real estate advisory for residential projects, luxury properties and investment opportunities across Gurgaon and Delhi-NCR." />

  <meta name="keywords"
    content="Gratia Estates, Gurgaon real estate, Delhi NCR property, luxury properties Gurgaon, residential projects Gurgaon, real estate advisory" />

  <meta name="author" content="Gratia Estates" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://www.gratiaestates.com/" />

  <!-- Social sharing defaults (link-preview bots do not run JavaScript) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gratia Estates" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="https://www.gratiaestates.com/" />
  <meta property="og:title" content="Gratia Estates | Premium Real Estate Advisory in Gurgaon" />
  <meta property="og:description" content="Compare new launch, under-construction and ready-to-move residential projects in Gurgaon with focused local guidance." />
  <meta property="og:image" content="https://www.gratiaestates.com/assets/logo-primary.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured data in the static HTML so crawlers see it without running
       JavaScript. "WebSite" sets the site name Google shows in results. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.gratiaestates.com/#website",
          "name": "Gratia Estates",
          "alternateName": ["Gratia Estate", "GratiaEstates", "gratiaestates.com"],
          "url": "https://www.gratiaestates.com/",
          "publisher": { "@id": "https://www.gratiaestates.com/#organization" }
        },
        {
          "@type": "RealEstateAgent",
          "@id": "https://www.gratiaestates.com/#organization",
          "name": "Gratia Estates",
          "alternateName": ["Gratia Estate", "Gratia Real Estates Advisory"],
          "legalName": "Gratia Real Estates Advisory Private Limited",
          "foundingDate": "2013-10-21",
          "url": "https://www.gratiaestates.com/",
          "logo": "https://www.gratiaestates.com/assets/logo-primary.png",
          "image": "https://www.gratiaestates.com/assets/logo-primary.png",
          "description": "Gurgaon-focused real estate advisory for new launch, under-construction and ready-to-move residential projects.",
          "telephone": "+91-9109776155",
          "email": "purwarmanish@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Iworkk Coworking Office Space, 90 IDC",
            "addressLocality": "Gurgaon",
            "addressRegion": "Haryana",
            "addressCountry": "IN"
          },
          "areaServed": [
            { "@type": "City", "name": "Gurgaon" },
            { "@type": "AdministrativeArea", "name": "Delhi NCR" }
          ]
        }
      ]
    }
  </script>
  <meta name="geo.region" content="IN-HR" />
  <meta name="geo.placename" content="Gurgaon" />

  <!-- Favicon -->
  <!-- Search engines show this icon next to the result (square, 48px multiples). -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Page Title -->
  <title>
    Gratia Estates | Premium Real Estate Advisory in Gurgaon
  </title>
</head>

<body>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
